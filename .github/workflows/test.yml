name: Build/test
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 20
      - run: npm install
      - run: npm test

  test_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: 20
      # NOTE: The Node binding needs Visual Studio to compile and the runner's
      # VS 2026 is newer than the node-gyp that npm ships with. This job only
      # runs `tree-sitter test`, so skip every install script and then fetch
      # just the tree-sitter CLI's prebuilt binary.
      #
      # The Node binding is still compiled by the `test` job, on Linux + MacOS.
      #
      - run: npm install --ignore-scripts
      - run: npm rebuild tree-sitter-cli
      - run: npm run-script test-windows

  test_python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: python -m unittest discover -v -s bindings/python/tests
