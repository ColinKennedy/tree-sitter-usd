name: Publish Python
on:
  push:
    tags:
      - "v*"
  # NOTE: A manual run builds and uploads the artifacts but does not publish
  # them. Handy for checking a release before tagging it.
  #
  workflow_dispatch:

jobs:
  # NOTE: A tag push carries no branch, so GitHub cannot filter one by branch.
  # This job does it instead - and it runs before anything is built, so a tag
  # on the wrong branch costs seconds instead of a full wheel matrix.
  #
  master:
    name: Tag is on master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # NOTE: `merge-base` needs real history. The default shallow clone
          # cannot answer whether one commit descends from another.
          #
          fetch-depth: 0
      - name: Check that the tag was pushed from master
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin master

          # NOTE: HEAD, not $GITHUB_SHA. This repository's tags are annotated,
          # so $GITHUB_SHA can be the tag object rather than the commit.
          #
          if git merge-base --is-ancestor HEAD FETCH_HEAD
          then
              echo "$GITHUB_REF_NAME is on master."
          else
              echo "::error::$GITHUB_REF_NAME is not on master. Refusing to publish."

              exit 1
          fi

  wheels:
    name: Wheels - ${{ matrix.os }}
    needs: [master]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # NOTE: See [tool.cibuildwheel] in pyproject.toml for what gets built.
      # On Linux this runs inside the manylinux / musllinux images, which is
      # the only way to produce a wheel that PyPI accepts.
      #
      - uses: pypa/cibuildwheel@v4.1.1
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    needs: [master]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # NOTE: Trusted Publishing. PyPI checks this workflow's OIDC token, so
      # no API token is ever stored in the repository.
      #
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # NOTE: PyPI rejects a re-upload of a file that it already has, which
          # would fail the whole step. Skipping the duplicates instead lets
          # wheels be added to a release whose sdist went up separately, and
          # makes a re-run after a half-finished upload safe.
          #
          skip-existing: true
