[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-usda"
description = "USD grammar for tree-sitter"
version = "0.8.0"
keywords = ["incremental", "parsing", "tree-sitter", "usd", "usda", "pixar"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Colin Kennedy" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/ColinKennedy/tree-sitter-usd"

[project.optional-dependencies]
core = ["tree-sitter~=0.25"]
example = ["PySide6-Essentials", "Qt.py", "tree-sitter~=0.25"]
test = ["tree-sitter~=0.25"]
# NOTE: Qt.py brings its own stubs, which is all that mypy needs in order to
# check examples/. The Qt bindings themselves are only needed to run them.
#
lint = ["mypy>=1.11", "Qt.py", "ruff>=0.6", "tree-sitter~=0.25"]

# NOTE: PyPI rejects plain `linux_x86_64` wheels, which is all that a local
# `python -m build` can make. cibuildwheel builds within the manylinux /
# musllinux images and re-tags the result so that it is installable.
#
[tool.cibuildwheel]
# NOTE: setup.py builds the extension against the stable ABI (abi3, 3.10+), so
# one wheel per platform serves every supported interpreter. Building CPython
# 3.10 is enough - 3.11+ installs that same wheel.
#
build = "cp310-*"
# NOTE: 32-bit Linux and Windows are skipped. Nobody runs USD there.
#
archs = "auto64"
test-requires = "tree-sitter~=0.25"
test-command = "python -m unittest discover -v -s {project}/bindings/python/tests"

# NOTE: The x86_64 wheel is cross-compiled from the arm64 runner, so
# cibuildwheel builds it but skips its tests. Intel Macs still get a wheel.
#
[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]

[tool.ruff]
line-length = 100
src = ["bindings/python", "bindings/python/tests", "examples/qt"]

[tool.ruff.lint]
select = ["A", "ANN", "B", "C4", "D", "E", "F", "I", "N", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["tree_sitter_qt", "tree_sitter_usda"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
files = ["bindings/python/tests", "examples/qt"]
mypy_path = ["bindings/python/tests", "examples/qt"]
strict = true

# NOTE: USD's Python bindings are optional (and unstubbed). examples/ only
# imports them to export binary layers as text.
#
[[tool.mypy.overrides]]
module = ["pxr.*"]
ignore_missing_imports = true
